    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Frontend Mentor | Product preview card component</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

        <!-- Imports fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        
        <main>

            <!-- Product Card -->
            <div class="card-container">

                <img src="images/image-product-mobile.jpg" alt="um frasco de perfume chanel" class="img-mobile">
                <img src="images/image-product-desktop.jpg" alt="um frasco de perfume chanel" class="img-desktop">
                
                <div class="text-container">
                    <p class="text-preset-4">Perfume</p>
                    <h1 class="text-preset-1">Gabrielle Essence Eau De Parfum</h1>
                    <p class="text-preset-3">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
                    <p class="text-preset-1">$149.99<span class="text-preset-5"><s>$169.99</s></span></p>
                    
                    <div class="button-container">
                        <button>Add to Cart</button>
                    </div>
                    
                </div>

            </div>
            
        </main>

        <footer class="attribution">
            <p>
                Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
                Coded by <a href="https://github.com/capellofabio">Fabio Capello de Souza</a>.
            </p>
        </footer>
    </body>
    </html>
